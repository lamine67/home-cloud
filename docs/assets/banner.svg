  </g>
  <text x="172" y="140" font-size="58" font-weight="700" fill="#ffffff">Homecloud</text>
  <text x="90" y="200" font-size="26" fill="#e9e5ff">Your own file cloud for home or a small team.</text>
  <text x="90" y="236" font-size="26" fill="#e9e5ff">One Docker command. No accounts anywhere else.</text>
  <g transform="translate(780 58)" font-size="17">
