    <g fill="#1f2226">
      <rect x="22" y="26" width="30" height="22" rx="4" fill="url(#mark)"/><text x="66" y="43">Photos</text><text x="320" y="43" fill="#8a8f98" font-size="14">2.4 GB</text>
      <rect x="22" y="70" width="30" height="22" rx="4" fill="url(#mark)"/><text x="66" y="87">Documents</text><text x="320" y="87" fill="#8a8f98" font-size="14">310 MB</text>
      <rect x="22" y="114" width="30" height="22" rx="4" fill="#e7e5f5"/><text x="66" y="131">vacation.mp4</text><text x="320" y="131" fill="#8a8f98" font-size="14">1.1 GB</text>
