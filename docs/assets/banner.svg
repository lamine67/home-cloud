<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#a855f7"/></linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g transform="translate(88 88) scale(0.07)">
    <rect width="1024" height="1024" rx="225" fill="#ffffff" opacity="0.18"/>
    <circle cx="380" cy="520" r="150" fill="#fff"/><circle cx="560" cy="440" r="190" fill="#fff"/><circle cx="730" cy="540" r="130" fill="#fff"/>
